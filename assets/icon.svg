  <path fill="#111111" fill-rule="evenodd" transform="translate(11 22.67) scale(0.23333)"
        d="M28 0 H152 A28 28 0 0 1 180 28 V52 A28 28 0 0 1 152 80 H28 A28 28 0 0 1 0 52 V28 A28 28 0 0 1 28 0 Z
           M148 40 A12 12 0 1 0 124 40 A12 12 0 1 0 148 40 Z"/>
</svg>
