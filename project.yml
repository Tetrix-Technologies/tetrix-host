name: TetrixHost

options:
  deploymentTarget:
    macOS: "26.0"
  usesTabs: true
  createIntermediateGroups: true
  generateEmptyDirectories: false
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  TetrixHost:
    type: application
    platform: macOS
    sources:
      - path: App/TetrixHost
    info:
      path: App/TetrixHost/Info.plist
      properties:
        CFBundleDisplayName: Tetrix Host
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Tetrix Technologies
        NSPrincipalClass: NSApplication
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: Tetrix Host
        PRODUCT_MODULE_NAME: TetrixHost
        PRODUCT_BUNDLE_IDENTIFIER: Tech.Tetrix.Host
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      - name: Build tetrix-host
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          set -e
          # Pass TETRIX_HOST_SKIP_HELPER=YES to xcodebuild to build the app
          # alone, for example while the Go code does not compile.
          if [ "${TETRIX_HOST_SKIP_HELPER:-NO}" = "YES" ]; then
          	echo "warning: TETRIX_HOST_SKIP_HELPER is set, so this build does not rebuild the tetrix-host helper."
          	exit 0
          fi
          # Xcode's PATH has no Go, so look where Go usually lives.
          PATH="$PATH:/usr/local/go/bin:/opt/homebrew/bin:$HOME/go/bin"
          if ! command -v go >/dev/null 2>&1; then
          	echo "warning: Go is not installed, so this build has no tetrix-host helper. Install Go, or set TETRIX_HOST_BINARY when you run the app."
          	exit 0
          fi
          HELPERS="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$HELPERS"
          cd "$SRCROOT"
          go build -o "$HELPERS/tetrix-host" ./cmd/tetrix-host
          if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
          	codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime "$HELPERS/tetrix-host"
          fi

  TetrixHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/TetrixHostTests
    dependencies:
      - target: TetrixHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: Tech.Tetrix.HostTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tetrix Host.app/Contents/MacOS/Tetrix Host

schemes:
  TetrixHost:
    build:
      targets:
        TetrixHost: all
        TetrixHostTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TetrixHostTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
